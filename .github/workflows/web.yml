# SPDX-License-Identifier: GPL-3.0-only
# Test n001se and build the firmware package (FiMba-1's workflow, without its browser version and
# site, which are not ported yet).
#
#   pull request      the full test suite; the firmware package built and checked; kept with the run
#                     as a download ("n001se-firmware")
#   a new VERSION     a push to main whose VERSION has no tag yet is a release: a release build
#                     (identity FM-1_8XXYYZZ), the commit tagged vX.Y.Z and published as a GitHub
#                     Release with the .fwsc and its CHANGELOG.md section.
name: Test, build and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # a run on main may be releasing: let it finish
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      # X.Y.Z when this run releases (main, VERSION not yet tagged), else empty
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: VERSION, its tag and its CHANGELOG section
        id: v
        run: |
          ver=$(tr -d ' \r\n' < VERSION)
          echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION is '$ver', not X.Y.Z"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "v$ver is released: nothing to release"
            exit 0
          fi
          # a new version: it needs its notes (checked on pull requests too, before it's merged)
          awk -v v="$ver" '$0 == "## " v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md | grep -q . ||
            { echo "::error::CHANGELOG.md has no '## $ver' section"; exit 1; }
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "releasing $ver"
            echo "release=$ver" >> "$GITHUB_OUTPUT"
          else
            echo "$ver will be released when this is on main"
          fi

  tests:
    name: Tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python packages (Pillow renders the screen's fonts)
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Tests (engine, platform, the whole app in the simulator)
        run: sh tests/run_tests.sh

      - name: Keep the scenario screenshots and audio
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarios
          path: build/scenarios/
          if-no-files-found: ignore

  firmware:
    name: Firmware package
    needs: version
    runs-on: ubuntu-latest
    env:
      AC79_SDK: ${{ github.workspace }}/../sdk
      JIELI_TOOLCHAIN: ${{ github.workspace }}/../jieli/toolchain
      JIELI_DOCKER: '1'          # the toolchain runs in a Debian container, as on a Mac
      # the FoMni commit the package is compared with (its update loader and boot head must match)
      FOMNI_REF: 405ef41aef75f7e70afd6decc01505df07c708e9
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python packages
        run: python3 -m pip install --quiet -r requirements.txt

      - name: JieLi toolchain (JieLi's server, else the same package from a Docker image)
        run: sh tools/get_toolchain.sh "$(dirname "$JIELI_TOOLCHAIN")"

      - name: AC79 SDK files (three, SHA-256 checked)
        run: sh tools/get_sdk.sh "$AC79_SDK"

      - name: Build the firmware package
        env:
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then python3 tools/build.py --release "$RELEASE"; else python3 tools/build.py; fi
          ls -l build/*.fwsc

      - name: Build FoMni's package, to compare with
        run: |
          git clone --quiet https://github.com/charlesvestal/fm1-fomni build/fomni-ref
          git -C build/fomni-ref checkout --quiet "$FOMNI_REF"
          cp tools/gen_font.py build/fomni-ref/tools/      # (the font only changes the app; works without raqm)
          (cd build/fomni-ref && python3 tools/build.py)

      - name: Check the package (every CRC; all but the app byte-identical to FoMni's)
        run: |
          pkg=$(ls build/n001se*.fwsc | head -1)
          python3 tools/check_fwsc.py "$pkg" --app build/n001se.bin --ref build/fomni-ref/build/omni.fwsc

      - name: Update-path and install tests against the package
        run: |
          [ -f build/n001se.fwsc ] || cp build/n001se-*.fwsc build/n001se.fwsc   # (the tests look for this name)
          sh tests/run_tests.sh

      - name: Keep the package with the run
        uses: actions/upload-artifact@v7
        with:
          name: n001se-firmware
          path: |
            build/n001se*.fwsc
            build/n001se.bin

  release:
    name: GitHub Release
    if: needs.version.outputs.release != ''
    needs: [version, tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Tag this commit and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.version.outputs.release }}
        run: |
          { echo "### What's new in $VER"; echo
            awk -v v="$VER" '$0 == "## " v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md | sed '/./,$!d'
            echo; sed "s/VERSION/$VER/g" .github/release-notes.md; } > notes.md
          gh release create "v$VER" --target "$GITHUB_SHA" --title "n001se $VER" --notes-file notes.md \
            --prerelease dist/n001se-firmware/n001se-"$VER".fwsc
